<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عيادة الابتسامة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0B2A3C;--aqua:#12B5A6;--aqua-d:#0C8F83;--mint:#E6F4F1;--ink:#16303F;--mut:#5B7381;--bg:#FAFCFC;--line:#D5E3E3}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
  a{color:inherit}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px}
  .bar{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff}
  .bar .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
  .brand{font-weight:800;font-size:18px}
  .lang{display:flex;border:1px solid #3B5B6E;border-radius:8px;overflow:hidden}
  .lang button{background:none;border:0;color:#B9CDD6;font:600 14px Cairo,sans-serif;padding:6px 14px;cursor:pointer}
  .lang button.on{background:var(--aqua);color:#04201D}
  .hero{background:var(--navy);color:#fff;padding:40px 0 48px}
  .hero .wrap{display:grid;gap:28px}
  .hero h1{font-size:clamp(28px,6vw,46px);line-height:1.25;margin:0 0 12px;font-weight:800}
  .hero p{margin:0 0 20px;color:#B9CDD6;font-size:17px;max-width:46ch}
  .btn{display:inline-block;padding:12px 24px;border-radius:10px;font:700 16px Cairo,sans-serif;text-decoration:none;border:2px solid transparent;cursor:pointer}
  .btn-main{background:var(--aqua);color:#04201D}
  .btn-ghost{border-color:#3B5B6E;color:#fff}
  .facts{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}
  .facts b{display:block;font-size:24px;color:var(--aqua)}
  .facts span{font-size:14px;color:#B9CDD6}
  .book{background:#fff;color:var(--ink);border-radius:14px;padding:22px}
  .book h2{margin:0 0 12px;font-size:20px}
  label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
  input,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;font:16px Cairo,sans-serif;background:#fff;color:var(--ink)}
  input:focus,select:focus,.btn:focus-visible,.lang button:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
  .book .btn{width:100%;margin-top:16px;background:var(--navy);color:#fff}
  section{padding:44px 0}
  h2.t{font-size:26px;margin:0 0 22px;font-weight:800}
  .list>div{display:grid;grid-template-columns:44px 1fr;gap:6px 14px;padding:16px 0;border-top:1px solid var(--line)}
  .list>div:last-child{border-bottom:1px solid var(--line)}
  .ic{grid-row:span 2;font-size:28px;line-height:1.2}
  .list h3{margin:0;font-size:18px}
  .list p{margin:0;color:var(--mut)}
  .alt{background:var(--mint)}
  .three{display:grid;gap:18px}
  .three h3{margin:0 0 4px;font-size:18px;color:var(--aqua-d)}
  .three p{margin:0}
  .q{margin:0 0 18px;padding-inline-start:16px;border-inline-start:4px solid var(--aqua)}
  .q p{margin:0 0 4px;font-size:17px}
  .q cite{font-style:normal;color:var(--mut);font-size:14px}
  .info{display:grid;gap:10px;font-size:17px}
  .info b{color:var(--aqua-d)}
  footer{background:var(--navy);color:#B9CDD6;text-align:center;padding:22px 0;font-size:14px}
  .wa{position:fixed;inset-block-end:18px;inset-inline-end:18px;width:56px;height:56px;border-radius:50%;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  @media(min-width:760px){
    .hero .wrap{grid-template-columns:1.15fr .85fr;align-items:center;gap:40px}
    .three{grid-template-columns:repeat(3,1fr)}
    .list{display:grid;grid-template-columns:1fr 1fr;column-gap:40px}
    .list>div:nth-last-child(2){border-bottom:1px solid var(--line)}
  }
</style>
</head>
<body>

<div class="bar"><div class="wrap">
  <div class="brand">🦷 <span data-i="brand"></span></div>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="ar">AR</button><button data-l="fr">FR</button><button data-l="en">EN</button>
  </div>
</div></div>

<header class="hero"><div class="wrap">
  <div>
    <h1 data-i="h1"></h1>
    <p data-i="sub"></p>
    <a class="btn btn-main" href="#book" data-i="cta"></a>
    <a class="btn btn-ghost" href="tel:+213666780427" data-i="call"></a>
    <div class="facts">
      <div><b>10+</b><span data-i="f1"></span></div>
      <div><b>5000+</b><span data-i="f2"></span></div>
      <div><b>4.9/5</b><span data-i="f3"></span></div>
    </div>
  </div>
  <form class="book" id="book">
    <h2 data-i="bt"></h2>
    <label for="n" data-i="ln"></label>
    <input id="n" required autocomplete="name">
    <label for="p" data-i="lp"></label>
    <input id="p" type="tel" required autocomplete="tel">
    <label for="s" data-i="ls"></label>
    <select id="s">
      <option data-i="s1"></option><option data-i="s2"></option><option data-i="s3"></option>
      <option data-i="s4"></option><option data-i="s5"></option><option data-i="s6"></option>
    </select>
    <button class="btn" type="submit" data-i="send"></button>
  </form>
</div></header>

<section><div class="wrap">
  <h2 class="t" data-i="st"></h2>
  <div class="list">
    <div><span class="ic">🪥</span><h3 data-i="s1"></h3><p data-i="d1"></p></div>
    <div><span class="ic">✨</span><h3 data-i="s2"></h3><p data-i="d2"></p></div>
    <div><span class="ic">🦷</span><h3 data-i="s3"></h3><p data-i="d3"></p></div>
    <div><span class="ic">😁</span><h3 data-i="s4"></h3><p data-i="d4"></p></div>
    <div><span class="ic">🧒</span><h3 data-i="s5"></h3><p data-i="d5"></p></div>
    <div><span class="ic">🚑</span><h3 data-i="s6"></h3><p data-i="d6"></p></div>
  </div>
</div></section>

<section class="alt"><div class="wrap">
  <h2 class="t" data-i="wt"></h2>
  <div class="three">
    <div><h3 data-i="w1"></h3><p data-i="w1d"></p></div>
    <div><h3 data-i="w2"></h3><p data-i="w2d"></p></div>
    <div><h3 data-i="w3"></h3><p data-i="w3d"></p></div>
  </div>
</div></section>

<section><div class="wrap">
  <h2 class="t" data-i="rt"></h2>
  <blockquote class="q"><p data-i="r1"></p><cite data-i="c1"></cite></blockquote>
  <blockquote class="q"><p data-i="r2"></p><cite data-i="c2"></cite></blockquote>
  <blockquote class="q"><p data-i="r3"></p><cite data-i="c3"></cite></blockquote>
</div></section>

<section class="alt"><div class="wrap">
  <h2 class="t" data-i="ct"></h2>
  <div class="info">
    <div><b data-i="hl"></b> <span data-i="hv"></span></div>
    <div><b data-i="al"></b> <span data-i="av"></span></div>
    <div><b data-i="pl"></b> <a href="tel:+213666780427" dir="ltr">+213 666 780 427</a></div>
  </div>
</div></section>

<footer><div class="wrap"><span data-i="rights"></span></div></footer>
<a class="wa" id="wa" href="#" aria-label="WhatsApp">💬</a>

let cur = "ar";
function setLang(l){
  cur = l;
  const d = document.documentElement;
  d.lang = l; d.dir = l === "ar" ? "rtl" : "ltr";
  document.title = T[l].title;
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = T[l][e.dataset.i]);
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === l));
  document.getElementById("wa").href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(T[l].msg);
  try { localStorage.setItem("lang", l); } catch (e) {}
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.l));
document.getElementById("book").addEventListener("submit", ev => {
  ev.preventDefault();
  const t = T[cur], s = document.getElementById("s");
  const text = t.msg + "\n" + t.kn + ": " + document.getElementById("n").value +
    "\n" + t.kp + ": " + document.getElementById("p").value +
    "\n" + t.ks + ": " + s.options[s.selectedIndex].textContent;
  window.open("https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text), "_blank");
});
let saved = "ar";
try { saved = localStorage.getItem("lang") || "ar"; } catch (e) {}
setLang(T[saved] ? saved : "ar");

  </html>
