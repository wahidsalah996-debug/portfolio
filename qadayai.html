*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 Cairo,Tahoma,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d9b86f;outline-offset:2px}

);background:#ffebe8;border-color:#efc8c1}.muted{color:var(--muted)}.empty{padding:24px;text-align:center;background:#fbf9f5;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row input[type=checkbox]{width:19px;height:19px;flex:none;accent-color:var(--green)}.row .tasktext{flex:1;overflow-wrap:anywhere}.done{text-decoration:line-through;color:var(--muted)}.iconbtn{border:0;background:transparent;color:var(--red);font-size:20px;padding:0 7px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.notice{background:#fff6e2;border:1px solid #ead7a6;color:#6c511d;border-radius:9px;padding:12px;font-size:13px}.lockbox{max-width:430px;margin:7vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:25px;box-shadow:0 10px 30px #1b1f2a0c;text-align:center}.lockbox h1{font:700 29px Amiri,serif;margin:0}.lockbox p{font-size:13px;color:var(--muted)}.err{min-height:25px;color:var(--red);font-size:13px}.hidden{display:none!important}dialog{border:0;border-radius:14px;padding:0;width:min(680px,calc(100% - 24px));max-height:90vh;box-shadow:0 20px 60px #0003}dialog::backdrop{background:#121621a8;backdrop-filter:blur(2px)}.dlghead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.dlgbody{padding:18px;overflow:auto;max-height:calc(90vh - 65px)}.dlghead h2{font:700 23px Amiri,serif;margin:0}#toast{position:fixed;bottom:16px;left:16px;right:16px;max-width:550px;margin:auto;background:var(--ink);color:#fff;padding:12px 16px;border-radius:9px;text-align:center;display:none;z-index:20}footer{max-width:1000px;margin:auto;text-align:center;padding:18px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}

<body>
<header id="topbar" class="hidden"><div class="inner"><div class="brand">⚖️ قضاياي</div><span class="badge">🔐 تشفير فعلي للبيانات</span><button class="topbtn" id="lockBtn">قفل التطبيق</button><button class="topbtn" id="exportBtn">نسخة احتياطية</button><button class="topbtn" id="importBtn">استيراد</button><input id="importFile" type="file" accept=".json,application/json" class="hidden"></div></header>

<div class="grid"><div><label for="f_type">نوع القضية</label><select id="f_type"><option>مدني</option><option>جنائي</option><option>تجاري</option><option>أسرة</option><option>إداري</option><option>عقاري</option><option>عمل</option><option>أخرى</option></select></div><div><label for="f_status">الحالة</label><select id="f_status"><option>قيد النظر</option><option>مؤجلة</option><option>محجوزة للحكم</option><option>منتهية - ربح</option><option>منتهية - خسارة</option><option>محفوظة</option></select></div></div>
<div class="grid"><div><label for="f_priority">الأولوية</label><select id="f_priority"><option value="عادية">عادية</option><option value="مهمة">مهمة</option><option value="عاجلة">عاجلة</option></select></div><div><label for="f_date">تاريخ الجلسة القادمة</label><input id="f_date" type="date"></div></div>
<label for="f_desc">ملخص وملاحظات سرية</label><textarea id="f_desc" maxlength="12000" placeholder="أدخل الملاحظات... تُحفظ مشفرة على هذا المتصفح"></textarea>

<script>
'use strict';
const STORE_KEY='qadayai_v4_encrypted';
const app=document.getElementById('app');
const topbar=document.getElementById('topbar');
const dialog=document.getElementById('caseDialog');
let cases=[],activeId=null,filterStatus='الكل',filterSearch='',cryptoKey=null,idleTimer=null,saveQueue=Promise.resolve();
const $=id=>document.getElementById(id);
const enc=new TextEncoder(),dec=new TextDecoder();
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._timer);t._timer=setTimeout(()=>t.style.display='none',3200);}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function formatDate(s){if(!s)return '—';const d=new Date(s+'T12:00:00');return Number.isNaN(d.getTime())?esc(s):new Intl.DateTimeFormat('ar-DZ',{year:'numeric',month:'short',day:'numeric'}).format(d);}
function daysUntil(s){if(!s)return null;const a=new Date(today()+'T00:00:00'),b=new Date(s+'T00:00:00');if(Number.isNaN(b.getTime()))return null;return Math.round((b-a)/86400000);}
function isLate(s){const n=daysUntil(s);return n!==null&&n<0;}
function isSoon(s){const n=daysUntil(s);return n!==null&&n>=0&&n<=7;}
function activeCase(c){return !String(c.status||'').includes('منتهية')&&c.status!=='محفوظة';}
function b64(bytes){let bin='';bytes.forEach(x=>bin+=String.fromCharCode(x));return btoa(bin);}
function unb64(s){const bin=atob(s);return Uint8Array.from(bin,c=>c.charCodeAt(0));}
function secureAvailable(){return !!(window.crypto&&crypto.subtle&&window.isSecureContext);}
async function deriveKey(pin,salt){const base=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encryptPayload(data,pin,saltBytes){const salt=saltBytes||crypto.getRandomValues(new Uint8Array(16));const iv=crypto.getRandomValues(new Uint8Array(12));const key=await deriveKey(pin,salt);const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode(JSON.stringify(data)));return {version:1,algorithm:'AES-GCM',kdf:'PBKDF2-SHA-256',iterations:310000,salt:b64(salt),iv:b64(iv),ciphertext:b64(new Uint8Array(cipher))};}
async function decryptPayload(payload,pin){if(!payload||payload.version!==1||payload.algorithm!=='AES-GCM')throw new Error('صيغة النسخة غير مدعومة');const key=await deriveKey(pin,unb64(payload.salt));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(payload.iv)},key,unb64(payload.ciphertext));const data=JSON.parse(dec.decode(plain));if(!Array.isArray(data))throw new Error('محتوى النسخة غير صالح');return {data,key};}
function storedPayload(){const raw=localStorage.getItem(STORE_KEY);return raw?JSON.parse(raw):null;}
async function persist(){saveQueue=saveQueue.then(async()=>{if(!cryptoKey)throw new Error('التطبيق مقفل');const salt=unb64(window._qadayaiSalt);const iv=crypto.getRandomValues(new Uint8Array(12));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},cryptoKey,enc.encode(JSON.stringify(cases)));const envelope={version:1,algorithm:'AES-GCM',kdf:'PBKDF2-SHA-256',iterations:310000,salt:window._qadayaiSalt,iv:b64(iv),ciphertext:b64(new Uint8Array(cipher))};localStorage.setItem(STORE_KEY,JSON.stringify(envelope));});return saveQueue;}
function isLocked(){return !cryptoKey;}
function lock(){clearTimeout(idleTimer);cryptoKey=null;cases=[];activeId=null;window._qadayaiSalt=null;renderLock();}
function resetIdle(){clearTimeout(idleTimer);if(!isLocked())idleTimer=setTimeout(lock,3*60*1000);}
['pointerdown','keydown','touchstart'].forEach(e=>document.addEventListener(e,resetIdle,{passive:true}));
async function unlockFlow(){const pin=$('pin').value;const err=$('pinErr');err.textContent='';if(pin.length<6){err.textContent='اجعل الرمز 6 أحرف أو أرقام على الأقل.';return;}if(!secureAvailable()){err.textContent='التشفير غير متاح في هذا المتصفح. افتح الصفحة عبر HTTPS أو متصفح حديث.';return;}
try{const payload=storedPayload();if(!payload){const confirmPin=$('pinConfirm').value;if(pin!==confirmPin){err.textContent='الرمزان غير متطابقين.';return;}const salt=crypto.getRandomValues(new Uint8Array(16));const envelope=await encryptPayload([],pin,salt);localStorage.setItem(STORE_KEY,JSON.stringify(envelope));cryptoKey=await deriveKey(pin,salt);window._qadayaiSalt=envelope.salt;cases=[];toast('تم إنشاء الخزنة المشفرة. احفظ رمزك جيداً.');render();}
else{const out=await decryptPayload(payload,pin);cases=out.data;cryptoKey=out.key;window._qadayaiSalt=payload.salt;render();toast('تم فتح الخزنة المشفرة.');}resetIdle();
}catch(e){cryptoKey=null;err.textContent='تعذر فتح البيانات. تحقق من الرمز أو من سلامة النسخة.';}}
function renderLock(){topbar.classList.add('hidden');const has=!!localStorage.getItem(STORE_KEY);app.innerHTML='<section class="lockbox"><h1>🔐 '+(has?'فتح خزنة قضاياي':'إنشاء خزنة مشفرة')+'</h1><p>تُشفّر البيانات باستخدام AES-GCM واشتقاق مفتاح PBKDF2. لا تُرسل القضايا إلى خادم.</p><div class="notice" style="text-align:start">تنبيه: إذا نسيت الرمز فلن يمكن استعادة البيانات. احتفظ بنسخة احتياطية مشفرة وبالرمز في مكان آمن.</div><form id="unlockForm"><label for="pin">رمز التشفير</label><input id="pin" type="password" autocomplete="current-password" minlength="6" maxlength="128" required placeholder="6 أحرف أو أرقام على الأقل"><div id="confirmWrap" class="'+(has?'hidden':'')+'"><label for="pinConfirm">تأكيد الرمز</label><input id="pinConfirm" type="password" autocomplete="new-password" minlength="6" maxlength="128" '+(has?'':'required')+'></div><div class="err" id="pinErr" role="alert"></div><button class="btn gold" style="width:100%;margin-top:8px" type="submit">'+(has?'فتح الخزنة':'إنشاء الخزنة')+'</button></form>'+(has?'<button class="btn danger sm" style="margin-top:12px" id="resetBtn">حذف الخزنة والبدء من جديد</button>':'')+'<p>لأمان أفضل، لا تستخدم رمزاً مستعملاً في حساباتك الأخرى.</p></section>';
$('unlockForm').addEventListener('submit',e=>{e.preventDefault();unlockFlow();});$('pin').focus();if(has)$('resetBtn').addEventListener('click',()=>{if(confirm('سيُحذف ملف الخزنة المشفرة نهائياً من هذا المتصفح. هل لديك نسخة احتياطية؟')){localStorage.removeItem(STORE_KEY);lock();}});}
function render(){if(isLocked()){renderLock();return;}topbar.classList.remove('hidden');if(activeId)renderDetail();else renderDashboard();}
function renderDashboard(){const total=cases.length,active=cases.filter(activeCase).length,urgent=cases.filter(c=>activeCase(c)&&(c.priority==='عاجلة'||isSoon(c.date))).length;const taskDone=cases.reduce((s,c)=>s+(c.tasks||[]).filter(t=>t.done).length,0),taskTotal=cases.reduce((s,c)=>s+(c.tasks||[]).length,0);const hearings=cases.filter(c=>c.date&&daysUntil(c.date)>=0&&activeCase(c)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
app.innerHTML='<section class="hero"><h1>إدارة ملفاتك القانونية بوضوح وخصوصية</h1><p>نظّم القضايا والجلسات والمهام والوثائق المسجلة من مكان واحد.</p></section><div class="privacy">🔐 الخزنة مفتوحة — البيانات محفوظة مشفرة على هذا المتصفح فقط. القفل التلقائي بعد 3 دقائق من عدم النشاط.</div><section class="stats"><div class="stat"><b>'+total+'</b>إجمالي القضايا</div><div class="stat"><b>'+active+'</b>قضايا نشطة</div><div class="stat"><b>'+urgent+'</b>عاجلة أو قريبة</div><div class="stat"><b>'+taskDone+'/'+taskTotal+'</b>مهام منجزة</div></section><section class="panel"><div class="panelhead"><h2>ملفات القضايا</h2><button class="btn gold" id="newCase">＋ قضية جديدة</button></div><div class="toolbar"><input id="search" aria-label="بحث في القضايا" placeholder="🔍 ابحث بالعنوان أو الرقم أو الموكل..." value="'+esc(filterSearch)+'"><select id="filter" aria-label="تصفية القضايا" style="max-width:180px"><option '+(filterStatus==='الكل'?'selected':'')+'>الكل</option><option '+(filterStatus==='قيد النظر'?'selected':'')+'>قيد النظر</option><option '+(filterStatus==='مؤجلة'?'selected':'')+'>مؤجلة</option><option '+(filterStatus==='عاجلة'?'selected':'')+'>عاجلة</option><option '+(filterStatus==='منتهية'?'selected':'')+'>منتهية</option><option '+(filterStatus==='محفوظة'?'selected':'')+'>محفوظة</option></select></div>'+(hearings.length?'<div class="notice" style="margin-top:12px">📅 <b>الجلسات القادمة:</b> '+hearings.map(c=>esc(c.title)+' — '+formatDate(c.date)).join(' • ')+'</div>':'')+'</section><div id="cards" class="casegrid"></div><section class="panel"><h2>حماية البيانات</h2><p class="muted" style="font-size:13px">البيانات مشفرة داخل التخزين المحلي، لكن ذلك لا يحمي من جهاز مخترق أو متصفح مصاب ببرمجيات خبيثة. لا تُدخل معلومات لا يلزمك تخزينها، ولا تعتمد على هذا التطبيق وحده لحفظ المواعيد القانونية. احتفظ بنسخة احتياطية مشفرة.</p><div class="actions no-print"><button class="btn light sm" id="printList">طباعة القائمة</button><button class="btn danger sm" id="wipeBtn">حذف كل البيانات</button></div></section>';
$('newCase').addEventListener('click',()=>openDialog());$('search').addEventListener('input',e=>{filterSearch=e.target.value;renderCards();});$('filter').addEventListener('change',e=>{filterStatus=e.target.value;renderCards();});$('printList').addEventListener('click',()=>window.print());$('wipeBtn').addEventListener('click',wipeAll);renderCards();}
function renderCards(){const box=$('cards');if(!box)return;const q=filterSearch.trim().toLocaleLowerCase('ar');let list=cases.filter(c=>{const statusOK=filterStatus==='الكل'||(filterStatus==='عاجلة'?(c.priority==='عاجلة'||isSoon(c.date)):filterStatus==='منتهية'?String(c.status).includes('منتهية'):c.status===filterStatus);const hay=[c.title,c.number,c.court,c.client,c.opponent,c.type].join(' ').toLocaleLowerCase('ar');return statusOK&&(!q||hay.includes(q));});list.sort((a,b)=>{const aa=a.date||'9999-99-99',bb=b.date||'9999-99-99';return aa.localeCompare(bb)||(a.priority==='عاجلة'?-1:1);});if(!list.length){box.innerHTML='<div class="empty" style="grid-column:1/-1">لا توجد قضايا مطابقة. أضف قضية جديدة أو غيّر خيارات البحث.</div>';return;}box.innerHTML=list.map(c=>{const done=(c.tasks||[]).filter(t=>t.done).length,tt=(c.tasks||[]).length,pct=tt?Math.round(done/tt*100):0;return '<article class="casecard" tabindex="0" role="button" aria-label="فتح القضية '+esc(c.title)+'" data-open="'+esc(c.id)+'"><h3>'+esc(c.title)+' '+(c.priority==='عاجلة'?'<span class="chip red">عاجلة</span>':'')+'</h3><div class="meta"><span class="chip">'+esc(c.type)+'</span><span class="chip '+(String(c.status).includes('منتهية')?'green':c.status==='مؤجلة'?'warn':'')+'">'+esc(c.status)+'</span>'+(c.number?'<span>📁 '+esc(c.number)+'</span>':'')+(c.date?'<span class="'+(isLate(c.date)?'':'')+'">📅 '+formatDate(c.date)+(isLate(c.date)?' • فات الموعد':isSoon(c.date)?' • قريب':'')+'</span>':'')+'</div>'+(c.client?'<p class="muted" style="font-size:13px;margin:8px 0 0">👤 '+esc(c.client)+(c.opponent?' · الخصم: '+esc(c.opponent):'')+'</p>':'')+(tt?'<div style="height:5px;background:var(--line);border-radius:9px;margin-top:12px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:var(--green)"></div></div><div class="muted" style="font-size:12px;margin-top:3px">'+done+'/'+tt+' مهام · '+pct+'%</div>':'')+'</article>';}).join('');box.querySelectorAll('[data-open]').forEach(el=>{const go=()=>openCase(el.dataset.open);el.addEventListener('click',go);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});});}
function renderDetail(){const c=cases.find(x=>x.id===activeId);if(!c){activeId=null;renderDashboard();return;}const done=(c.tasks||[]).filter(t=>t.done).length,tt=(c.tasks||[]).length;app.innerHTML='<button class="btn light sm no-print" id="backBtn">← العودة للقائمة</button><section class="panel"><div class="panelhead"><h2>'+esc(c.title)+'</h2><span class="chip">'+esc(c.number||'بدون رقم')+'</span></div><div class="meta"><span class="chip">'+esc(c.type)+'</span><span class="chip">'+esc(c.status)+'</span><span class="chip '+(c.priority==='عاجلة'?'red':c.priority==='مهمة'?'warn':'')+'">'+esc(c.priority)+'</span>'+(c.date?'<span>📅 الجلسة: '+formatDate(c.date)+'</span>':'')+'</div><div class="grid" style="margin-top:15px;font-size:14px"><div>🏛️ <b>المحكمة:</b> '+esc(c.court||'—')+'</div><div>👤 <b>الموكل:</b> '+esc(c.client||'—')+'</div><div>⚔️ <b>الخصم:</b> '+esc(c.opponent||'—')+'</div><div>🗓️ <b>تاريخ التسجيل:</b> '+formatDate(c.createdAt)+'</div></div>'+(c.desc?'<div class="notice" style="margin-top:14px;white-space:pre-wrap"><b>ملاحظات سرية</b><br>'+esc(c.desc)+'</div>':'')+'<div class="actions no-print"><button class="btn gold sm" id="editCase">✏️ تعديل</button><button class="btn light sm" id="printCase">🖨️ طباعة / PDF</button><button class="btn danger sm" id="deleteCase">حذف القضية</button></div></section><section class="panel"><div class="panelhead"><h2>المهام والإجراءات</h2><span class="chip">'+done+'/'+tt+' منجزة</span></div><div id="taskList">'+((c.tasks||[]).map((t,i)=>'<div class="row"><input type="checkbox" data-task="'+i+'" '+(t.done?'checked':'')+' aria-label="إتمام المهمة"><span class="tasktext '+(t.done?'done':'')+'">'+esc(t.text)+'</span><button class="iconbtn" data-remove-task="'+i+'" aria-label="حذف المهمة">×</button></div>').join('')||'<div class="empty">لا توجد مهام مسجلة بعد.</div>')+'</div><form id="taskForm" class="toolbar no-print" style="margin-top:12px"><input id="newTask" maxlength="500" placeholder="إضافة إجراء، مثل: إيداع مذكرة دفاع" required><button class="btn" type="submit">إضافة</button></form></section><section class="panel"><div class="panelhead"><h2>سجل الوثائق</h2></div><div class="notice">يسجل التطبيق اسم الوثيقة وتصنيفها فقط، ولا يرفع الملفات أو يخزن محتواها.</div><div id="docList">'+((c.docs||[]).map((d,i)=>'<div class="row"><span class="tasktext">📄 '+esc(d.name)+' <small class="muted">· '+esc(d.cat)+' · '+esc(d.date)+'</small></span><button class="iconbtn" data-remove-doc="'+i+'" aria-label="حذف الوثيقة">×</button></div>').join('')||'<div class="empty">لا توجد وثائق مسجلة.</div>')+'</div><form id="docForm" class="grid no-print" style="margin-top:12px"><div><label for="docName">اسم الوثيقة</label><input id="docName" maxlength="200" required placeholder="مثال: عقد أو حكم"></div><div><label for="docCat">التصنيف</label><select id="docCat"><option>عقد</option><option>حكم</option><option>مذكرة</option><option>توكيل</option><option>مراسلة</option><option>إثبات</option><option>أخرى</option></select></div><button class="btn sm" type="submit" style="grid-column:1/-1;margin-top:8px">＋ تسجيل الوثيقة</button></form></section>';
$('backBtn').addEventListener('click',()=>{activeId=null;render();});$('editCase').addEventListener('click',()=>openDialog(c.id));$('printCase').addEventListener('click',()=>window.print());$('deleteCase').addEventListener('click',()=>deleteCase(c.id));$('taskForm').addEventListener('submit',e=>{e.preventDefault();const text=$('newTask').value.trim();if(!text)return;c.tasks=c.tasks||[];c.tasks.push({text:text,done:false});persistAndRender('تمت إضافة المهمة.');});$('docForm').addEventListener('submit',e=>{e.preventDefault();const name=$('docName').value.trim();if(!name)return;c.docs=c.docs||[];c.docs.push({name:name,cat:$('docCat').value,date:today()});persistAndRender('تم تسجيل الوثيقة.');});app.querySelectorAll('[data-task]').forEach(el=>el.addEventListener('change',()=>{c.tasks[Number(el.dataset.task)].done=el.checked;persistAndRender('تم تحديث المهمة.');}));app.querySelectorAll('[data-remove-task]').forEach(el=>el.addEventListener('click',()=>{if(confirm('حذف هذه المهمة؟')){c.tasks.splice(Number(el.dataset.removeTask),1);persistAndRender('تم حذف المهمة.');}}));app.querySelectorAll('[data-remove-doc]').forEach(el=>el.addEventListener('click',()=>{if(confirm('حذف تسجيل الوثيقة؟')){c.docs.splice(Number(el.dataset.removeDoc),1);persistAndRender('تم حذف تسجيل الوثيقة.');}}));}
async function persistAndRender(msg){try{await persist();render();if(msg)toast(msg);}catch(e){toast('تعذر الحفظ: '+e.message);}}
function openDialog(id){const c=id?cases.find(x=>x.id===id):null;$('dialogTitle').textContent=c?'تعديل القضية':'قضية جديدة';$('caseId').value=c?c.id:'';$('f_title').value=c?c.title:'';$('f_number').value=c?c.number||'':'';$('f_court').value=c?c.court||'':'';$('f_client').value=c?c.client||'':'';$('f_opponent').value=c?c.opponent||'':'';$('f_type').value=c?c.type||'مدني':'مدني';$('f_status').value=c?c.status||'قيد النظر':'قيد النظر';$('f_priority').value=c?c.priority||'عادية':'عادية';$('f_date').value=c?c.date||'':'';$('f_desc').value=c?c.desc||'':'';dialog.showModal();$('f_title').focus();}
function closeDialog(){dialog.close();}
$('closeDialog').addEventListener('click',closeDialog);$('cancelCase').addEventListener('click',closeDialog);dialog.addEventListener('click',e=>{if(e.target===dialog)closeDialog();});
$('caseForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('caseId').value||('case_'+crypto.randomUUID());const old=cases.find(c=>c.id===id);const c={id,title:$('f_title').value.trim(),number:$('f_number').value.trim(),court:$('f_court').value.trim(),client:$('f_client').value.trim(),opponent:$('f_opponent').value.trim(),type:$('f_type').value,status:$('f_status').value,priority:$('f_priority').value,date:$('f_date').value,desc:$('f_desc').value.trim(),createdAt:old?old.createdAt:today(),tasks:old?old.tasks||[]:[],docs:old?old.docs||[]:[]};if(!c.title)return;if(old)cases=cases.map(x=>x.id===id?c:x);else cases.push(c);activeId=id;closeDialog();await persistAndRender('تم حفظ القضية بتشفير.');});
function openCase(id){activeId=id;render();}
async function deleteCase(id){if(!confirm('حذف القضية وكل مهامها وسجل وثائقها نهائياً؟'))return;cases=cases.filter(c=>c.id!==id);activeId=null;await persistAndRender('تم حذف القضية.');}
async function wipeAll(){if(!confirm('سيتم حذف كل القضايا والمهام وسجل الوثائق نهائياً. أنشئ نسخة احتياطية أولاً إن احتجت إليها. متابعة؟'))return;cases=[];try{await persist();activeId=null;render();toast('تم حذف كل البيانات.');}catch(e){toast('تعذر الحذف: '+e.message);}}
$('lockBtn').addEventListener('click',lock);
$('exportBtn').addEventListener('click',()=>{try{const payload=storedPayload();if(!payload){toast('لا توجد بيانات لتصديرها.');return;}const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='qadayai-encrypted-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('تم تصدير نسخة احتياطية مشفرة.');}catch(e){toast('تعذر التصدير.');}});
$('importBtn').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{const payload=JSON.parse(await file.text());const pin=prompt('أدخل رمز النسخة الاحتياطية لفك التحقق عنها:');if(pin===null)return;const out=await decryptPayload(payload,pin);if(!confirm('استيراد النسخة سيستبدل البيانات الحالية. هل تريد المتابعة؟'))return;cases=out.data;cryptoKey=out.key;window._qadayaiSalt=payload.salt;await persist();activeId=null;render();toast('تم استيراد النسخة المشفرة بنجاح.');}catch(err){alert('فشل الاستيراد: الملف غير صالح أو رمز التشفير غير صحيح.');}finally{e.target.value='';}});
window.addEventListener('storage',e=>{if(e.key===STORE_KEY&&!isLocked()){toast('تغيّرت بيانات الخزنة في تبويب آخر. اقفل التطبيق ثم افتحه مجدداً لتحديثها.');}});
if(!secureAvailable()){app.innerHTML='<section class="lockbox"><h1>يتطلب التطبيق اتصالاً آمناً</h1><p>ميزة التشفير تحتاج إلى Web Crypto في سياق آمن.</p><p>افتح الموقع عبر HTTPS، مثل GitHub Pages، أو استخدم متصفحاً حديثاً.</p></section>';}else renderLock();
</script>
