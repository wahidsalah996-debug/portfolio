!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتب العدالة للمحاماة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1B1F2A;--gold:#B8924A;--gold-d:#8C6B2C;--paper:#F7F4EE;--line:#DDD6C8;--mut:#5E5A52;--white:#fff}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--white);color:var(--ink);line-height:1.7}
  a{color:inherit}
  h1,h2,.brand{font-family:Amiri,Georgia,"Times New Roman",serif}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px}
  .bar{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;border-bottom:2px solid var(--gold)}
  .bar .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
  .brand{font-size:21px;font-weight:700}
  .lang{display:flex;border:1px solid #4A4F5E;border-radius:6px;overflow:hidden}
  .lang button{background:none;border:0;color:#B8BCC8;font:600 14px Cairo,sans-serif;padding:6px 14px;cursor:pointer}
  .lang button.on{background:var(--gold);color:#1B1305}
  .hero{background:var(--ink);color:#fff;padding:44px 0 52px}
  .hero .wrap{display:grid;gap:28px}
  .hero h1{font-size:clamp(30px,6.5vw,50px);line-height:1.25;margin:0 0 12px}
  .hero p{margin:0 0 22px;color:#C9CCD6;font-size:17px;max-width:46ch}
  .btn{display:inline-block;padding:12px 24px;border-radius:6px;font:700 16px Cairo,sans-serif;text-decoration:none;border:2px solid transparent;cursor:pointer}
  .btn-main{background:var(--gold);color:#1B1305}
  .btn-ghost{border-color:#4A4F5E;color:#fff}
  .facts{display:flex;gap:28px;margin-top:26px;flex-wrap:wrap}
  .facts b{display:block;font:700 28px Amiri,Georgia,serif;color:var(--gold)}
  .facts span{font-size:14px;color:#C9CCD6}
  .book{background:var(--paper);color:var(--ink);border-radius:8px;padding:22px;border-top:4px solid var(--gold)}
  .book h2{margin:0 0 12px;font-size:23px}
  label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
  input,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:6px;font:16px Cairo,sans-serif;background:#fff;color:var(--ink)}
  input:focus,select:focus,.btn:focus-visible,.lang button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .book .btn{width:100%;margin-top:16px;background:var(--ink);color:#fff}
  .note{font-size:13px;color:var(--mut);margin:10px 0 0}
  section{padding:46px 0}
  h2.t{font-size:30px;margin:0 0 22px}
  h2.t::after{content:"";display:block;width:56px;height:3px;background:var(--gold);margin-top:8px}
  .list>div{display:grid;grid-template-columns:44px 1fr;gap:6px 14px;padding:16px 0;border-top:1px solid var(--line)}
  .list>div:last-child{border-bottom:1px solid var(--line)}
  .ic{grid-row:span 2;font-size:28px;line-height:1.2}
  .list h3{margin:0;font-size:18px}
  .list p{margin:0;color:var(--mut)}
  .alt{background:var(--paper)}
  .three{display:grid;gap:20px}
  .three h3{margin:0 0 4px;font-size:18px;color:var(--gold-d)}
  .three p{margin:0}
  .steps{counter-reset:s;display:grid;gap:18px}
  .steps div{position:relative;padding-inline-start:52px}
  .steps div::before{counter-increment:s;content:counter(s);position:absolute;inset-inline-start:0;top:0;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--gold);font:700 20px Amiri,Georgia,serif;display:flex;align-items:center;justify-content:center}
  .steps h3{margin:0 0 2px;font-size:18px}
  .steps p{margin:0;color:var(--mut)}
  .info{display:grid;gap:10px;font-size:17px}
  .info b{color:var(--gold-d)}
  footer{background:var(--ink);color:#B8BCC8;text-align:center;padding:24px 0;font-size:14px}
  footer p{margin:4px 0}
  .wa{position:fixed;inset-block-end:18px;inset-inline-end:18px;width:56px;height:56px;border-radius:50%;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  @media(min-width:760px){
    .hero .wrap{grid-template-columns:1.15fr .85fr;align-items:center;gap:40px}
    .three,.steps{grid-template-columns:repeat(3,1fr)}
    .list{display:grid;grid-template-columns:1fr 1fr;column-gap:40px}
    .list>div:nth-last-child(2){border-bottom:1px solid var(--line)}
  }
</style>
</head>
<body>

<div class="bar"><div class="wrap">
  <div class="brand">⚖️ <span data-i="brand"></span></div>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="ar">AR</button><button data-l="fr">FR</button><button data-l="en">EN</button>
  </div>
</div></div>

<header class="hero"><div class="wrap">
  <div>
    <h1 data-i="h1"></h1>
    <p data-i="sub"></p>
    <a class="btn btn-main" href="#book" data-i="cta"></a>
    <a class="btn btn-ghost" href="tel:+213000000000" data-i="call"></a>
    <div class="facts">
      <div><b>15+</b><span data-i="f1"></span></div>
      <div><b>1000+</b><span data-i="f2"></span></div>
      <div><b>3</b><span data-i="f3"></span></div>
    </div>
  </div>
  <form class="book" id="book">
    <h2 data-i="bt"></h2>
    <label for="n" data-i="ln"></label>
    <input id="n" required autocomplete="name">
    <label for="p" data-i="lp"></label>
    <input id="p" type="tel" required autocomplete="tel">
    <label for="s" data-i="ls"></label>
    <select id="s">
      <option data-i="a1"></option><option data-i="a2"></option><option data-i="a3"></option><option data-i="a4"></option>
      <option data-i="a5"></option><option data-i="a6"></option><option data-i="a7"></option><option data-i="a8"></option>
    </select>
    <button class="btn" type="submit" data-i="send"></button>
    <p class="note" data-i="conf"></p>
  </form>
</div></header>

<section><div class="wrap">
  <h2 class="t" data-i="st"></h2>
  <div class="list">
    <div><span class="ic">👨‍👩‍👧</span><h3 data-i="a1"></h3><p data-i="d1"></p></div>
    <div><span class="ic">🏢</span><h3 data-i="a2"></h3><p data-i="d2"></p></div>
    <div><span class="ic">🏠</span><h3 data-i="a3"></h3><p data-i="d3"></p></div>
    <div><span class="ic">👷</span><h3 data-i="a4"></h3><p data-i="d4"></p></div>
    <div><span class="ic">🛡️</span><h3 data-i="a5"></h3><p data-i="d5"></p></div>
    <div><span class="ic">📝</span><h3 data-i="a6"></h3><p data-i="d6"></p></div>
    <div><span class="ic">🤝</span><h3 data-i="a7"></h3><p data-i="d7"></p></div>
    <div><span class="ic">💬</span><h3 data-i="a8"></h3><p data-i="d8"></p></div>
  </div>
</div></section>

<section class="alt"><div class="wrap">
  <h2 class="t" data-i="wt"></h2>
  <div class="three">
    <div><h3 data-i="w1"></h3><p data-i="w1d"></p></div>
    <div><h3 data-i="w2"></h3><p data-i="w2d"></p></div>
    <div><h3 data-i="w3"></h3><p data-i="w3d"></p></div>
  </div>
</div></section>

<section><div class="wrap">
  <h2 class="t" data-i="ht"></h2>
  <div class="steps">
    <div><h3 data-i="h1t"></h3><p data-i="h1d"></p></div>
    <div><h3 data-i="h2t"></h3><p data-i="h2d"></p></div>
    <div><h3 data-i="h3t"></h3><p data-i="h3d"></p></div>
  </div>
</div></section>

<section class="alt"><div class="wrap">
  <h2 class="t" data-i="ct"></h2>
  <div class="info">
    <div><b data-i="hl"></b> <span data-i="hv"></span></div>
    <div><b data-i="al"></b> <span data-i="av"></span></div>
    <div><b data-i="pl"></b> <a href="tel:+213000000000" dir="ltr">+213 000 000 000</a></div>
  </div>
</div></section>

<footer><div class="wrap">
  <p data-i="rights"></p>
  <p data-i="disc"></p>
</div></footer>
<a class="wa" id="wa" href="#" aria-label="WhatsApp">💬</a>

let cur = "ar";
function setLang(l){
  cur = l;
  const d = document.documentElement;
  d.lang = l; d.dir = l === "ar" ? "rtl" : "ltr";
  document.title = T[l].title;
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = T[l][e.dataset.i]);
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === l));
  document.getElementById("wa").href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(T[l].msg);
  try { localStorage.setItem("lang", l); } catch (e) {}
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.l));
document.getElementById("book").addEventListener("submit", ev => {
  ev.preventDefault();
  const t = T[cur], s = document.getElementById("s");
  const text = t.msg + "\n" + t.kn + ": " + document.getElementById("n").value +
    "\n" + t.kp + ": " + document.getElementById("p").value +
    "\n" + t.ks + ": " + s.options[s.selectedIndex].textContent;
  window.open("https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text), "_blank");
});
let saved = "ar";
try { saved = localStorage.getItem("lang") || "ar"; } catch (e) {}
setLang(T[saved] ? saved : "ar");

</body>
</html>
